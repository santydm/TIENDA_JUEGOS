{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tienda de videojuegos{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="{% static "js/script.js" %}"></script>
</head>
<body class="bg-body text-body">

    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <button id="toggle-theme" class="btn btn-outline-secondary 
        rounded-circle shadow-sm d-flex align-items-center 
        justify-content-center"
        style="width: 45px; height: 45px; transition: all 0.3s ease;">
        <i class="fa-solid fa-circle-half-stroke"></i></button>
    </header>

    {% block content %}

    {% endblock %}

    <footer class="text-center mt-5 mb-3">
        <p>copyright 2026 Tienda de Videojuegos</p>
        <a href="{% url 'home' %}" class="text-body">Inicio</a>
        <a href="{% url 'contacto' %}" class="text-body ms-3">Contacto</a>
    </footer>

</body>
</html>
